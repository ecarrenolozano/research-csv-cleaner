[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-csv-cleaner"
version = "0.1.0"
description = "A small research data cleaning tool used to demonstrate requirement evolution in an AI-assisted SDLC workflow."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Edwin Carreño", email = "edwin1892@gmail.com" },
]
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
  "bump-my-version>=0.28",
  "coverage[toml]>=7.9",
  "hatchling>=1.27",
  "mypy>=1.16",
  "pre-commit>=4.2",
  "pytest>=8.4",
  "pytest-bdd>=7.3",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]
docs = [
  "mkdocs>=1.6",
  "zensical>=0.0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_csv_cleaner"]

[tool.pytest.ini_options]
addopts = "--cov=research_csv_cleaner --cov-report=term-missing"
testpaths = ["tests"]
bdd_features_base_dir = "tests/validation/features"

[tool.coverage.run]
branch = true
source = ["research_csv_cleaner"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.bumpversion]
current_version = "0.1.0"
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""
